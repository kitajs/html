name: Release Flow

on:
  push:
    branches: [master, next]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write # Required for OIDC
  contents: write # Required to push the release branch, tags and releases
  pull-requests: write # Required to create a release PR

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}

    environment:
      name: NPM Registry

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm, node and install packages
        uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Apply pending change intents
        id: version
        run: |
          {
            echo 'plan<<EOF'
            pnpm change status
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          pnpm version -r

          if [ -n "$(git status --porcelain)" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      # Pending intents: open or update the release PR, publish once it gets merged
      - name: Create release pull request
        if: ${{ steps.version.outputs.bumped == 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          branch: pnpm-release/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          commit-message: 'chore: update versions'
          title: 'Release plan'
          body: |
            Merging this PR publishes the following versions to npm.

            ```
            ${{ steps.version.outputs.plan }}
            ```

      - name: Cache turbo build setup
        if: ${{ steps.version.outputs.bumped != 'true' }}
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build
        if: ${{ steps.version.outputs.bumped != 'true' }}
        run: pnpm build

      # Only versions not yet in the registry are published, so this is a no-op
      # for pushes that did not merge a release PR
      - name: Publish
        if: ${{ steps.version.outputs.bumped != 'true' }}
        run: >-
          pnpm publish -r --access public --report-summary --tag ${{ github.ref_name ==
          'next' && 'next' || 'latest' }} --publish-branch ${{ github.ref_name }}
        env:
          PNPM_CONFIG_PROVENANCE: true

      - name: Create GitHub releases
        if: ${{ steps.version.outputs.bumped != 'true' }}
        run: node .github/scripts/create-github-releases.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
